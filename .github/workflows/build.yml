name: Build APK

"on":
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            gettext \
            autopoint \
            aidl

      - name: Check Java and AIDL
        run: |
          java -version
          javac -version
          aidl --version || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install setuptools
          pip install cython==0.29.34

      - name: Install Buildozer dependencies
        run: |
          pip install \
            appdirs \
            colorama \
            jinja2 \
            "sh>=2,<3" \
            meson \
            ninja \
            build \
            toml \
            packaging \
            "wheel~=0.43.0"

      - name: Verify project files
        run: |
          ls -la
          test -f main.py
          test -f buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK files
        if: success()
        run: |
          ls -lh bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-APK
          path: bin/*.apk
          if-no-files-found: error
