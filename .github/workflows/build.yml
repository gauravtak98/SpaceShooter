name: Build APK

"on":
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            gettext autopoint rustc cargo

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install setuptools
          pip install "cython==0.29.34"

      - name: Accept Android SDK license
        run: |
          mkdir -p ~/.buildozer/android/platform
          touch ~/.buildozer/android/platform/.license_accepted

      - name: Verify files
        run: |
          ls -la
          test -f main.py
          test -f buildozer.spec

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Show APK
        if: success()
        run: |
          ls -lh bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-APK
          path: bin/*.apk
          if-no-files-found: error
